<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef3f8" />
  <title>oii</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login-view" id="loginView">
    <div class="login-panel">
      <form id="loginForm">
        <label>用户名<input id="username" name="username" autocomplete="username" required minlength="2" maxlength="24" /></label>
        <label>QQ号<input id="qqId" name="qq_id" inputmode="numeric" required pattern="[0-9]{5,14}" /></label>
        <button class="primary-button" type="submit">进入</button>
      </form>
      <div class="form-error" id="loginError" role="alert"></div>
    </div>
  </div>

  <div class="app-view hidden" id="appView">
    <header class="app-header">
      <div class="wordmark"><span class="qq-mark">Q</span><span>模拟 QQ</span><small>· 中控助手</small></div>
      <div class="header-user"><span class="online-dot"></span><span id="userDisplay"></span><button id="logoutButton" class="text-button">退出</button></div>
    </header>
    <main class="workspace">
      <aside class="guide-panel">
        <div class="profile"><div class="avatar" id="avatarText">U</div><div><strong id="profileName">user</strong><small id="profileQq">QQ</small></div><span class="status-label">在线</span></div>
        <div class="guide-heading"><span>⌁</span><div><strong>功能服务</strong><small>发送给中控的指令参考</small></div></div>
        <div class="guide-list">
          <button class="guide-item" data-command="今天广州天气怎么样？"><span class="guide-icon blue">☼</span><span><b>天气查询</b><small>今天广州天气怎么样？</small></span><i>→</i></button>
          <button class="guide-item" data-command="打开微信"><span class="guide-icon violet">▣</span><span><b>电脑控制</b><small>打开微信 / 浏览器</small></span><i>→</i></button>
          <button class="guide-item" data-command="帮我播放一首音乐"><span class="guide-icon pink">♫</span><span><b>音乐播放</b><small>播放、暂停或切换音乐</small></span><i>→</i></button>
          <button class="guide-item" data-command="陪我聊聊天"><span class="guide-icon cyan">◌</span><span><b>自然对话</b><small>直接说出你的想法</small></span><i>→</i></button>
        </div>
        <div class="privacy-box"><span>⌘</span><div><b>会话隔离</b><small>当前 user 的消息使用独立上下文。私人 QQ 才会接入你的个人记忆。</small></div></div>
      </aside>
      <section class="chat-panel">
        <div class="chat-top"><div><h1>中控助手</h1><p><span class="online-dot"></span> 已连接 · 可以开始发送指令</p></div><span class="shield">⌾ 安全通道</span></div>
        <div class="messages" id="messages"><div class="welcome"><div class="welcome-mark">Q</div><h2>你好，<span id="welcomeName">user</span></h2><p>我是你的中控助手。你可以像发 QQ 消息一样，直接告诉我想做什么。</p><div class="welcome-line"></div></div></div>
        <form class="composer" id="messageForm"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="输入消息，或点击左侧功能…"></textarea><div class="composer-footer"><span id="charCount">0 / 4000</span><span class="hint">Enter 发送 · Shift + Enter 换行</span><button class="send-button" type="submit" aria-label="发送">↑</button></div></form>
      </section>
    </main>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
