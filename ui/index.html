<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef3f8" />
  <title>oii</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login-view" id="loginView">
    <div class="login-panel">
      <form id="loginForm">
        <label>用户名<input id="username" name="username" autocomplete="username" required minlength="2" maxlength="24" /></label>
        <label>QQ号<input id="qqId" name="qq_id" inputmode="numeric" required pattern="[0-9]{5,14}" /></label>
        <button class="primary-button" type="submit">进入</button>
      </form>
      <div class="form-error" id="loginError" role="alert"></div>
    </div>
  </div>

  <div class="app-view hidden" id="appView">
    <header class="app-header">
      <div class="wordmark"><span class="qq-mark">Q</span><span>模拟 QQ</span><small>· 中控助手</small></div>
      <div class="header-user"><span class="online-dot"></span><span id="userDisplay"></span><button id="logoutButton" class="text-button">退出</button></div>
    </header>
    <main class="workspace">
      <aside class="device-card" aria-label="MG946R servo control">
        <div class="device-card-head"><div><span class="eyebrow">DEVICE CONTROL</span><h2>MG946R 舵机</h2><p id="deviceEndpoint">ws://36.212.7.43:8777/ws</p></div><span class="device-state offline" id="deviceState">离线</span></div>
        <div class="device-meta"><span>设备 ID</span><strong>mg946r-001</strong></div>
        <div class="device-angle"><div><span>当前角度</span><strong id="deviceAngle">—°</strong></div><span id="deviceConnectionText">未连接</span></div>
        <input id="angleRange" type="range" min="0" max="180" value="90" aria-label="舵机角度" />
        <div class="angle-row"><input id="angleInput" type="number" min="0" max="180" value="90" aria-label="角度" /><button id="angleButton" class="device-primary" type="button">发送角度</button></div>
        <div class="device-actions"><button type="button" data-device-command="left">左转</button><button type="button" data-device-command="center">回中</button><button type="button" data-device-command="right">右转</button><button type="button" data-device-command="sweep">扫描</button></div>
        <button id="deviceConnectButton" class="device-connect" type="button">连接设备</button><small class="device-note">支持本地网页和中控 WebSocket 控制，角度范围 0–180°。</small>
      </aside>
      <section class="chat-panel">
        <div class="chat-top"><div><h1>中控助手</h1><p><span class="online-dot"></span> 已连接 · 可以开始发送指令</p></div><span class="shield">⌾ 安全通道</span></div>
        <div class="messages" id="messages"><div class="welcome"><div class="welcome-mark">Q</div><h2>你好，<span id="welcomeName">user</span></h2><p>我是你的中控助手。你可以像发 QQ 消息一样，直接告诉我想做什么。</p><div class="welcome-line"></div></div></div>
        <form class="composer" id="messageForm"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="输入消息，或点击左侧功能…"></textarea><div class="composer-footer"><span id="charCount">0 / 4000</span><span class="hint">Enter 发送 · Shift + Enter 换行</span><button class="send-button" type="submit" aria-label="发送">↑</button></div></form>
      </section>
    </main>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
