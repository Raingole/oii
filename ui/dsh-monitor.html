<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="referrer" content="no-referrer">
  <title>DSH 交互台 · OII</title>
  <link rel="stylesheet" href="/dsh-monitor.css?v=1">
  <script src="/dsh-monitor.js?v=1" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">O</span><b>OII</b></a>
    <nav aria-label="页面导航"><a href="/">对话</a><a href="/knowledge.html">知识花园</a><a href="/memory.html">记忆观察台</a><a class="selected" href="/dsh-monitor.html">DSH 交互台</a></nav>
    <button id="connect" class="button light" type="button">连接观察台</button>
  </header>
  <main class="page">
    <section class="heading">
      <div><h1>OII 与 DSH 的交互记录</h1><p>查看真实任务输入、启动过程、运行输出与 QQ 投递结果。</p></div>
      <div class="controls"><label class="auto-label" for="auto-refresh">自动刷新<input id="auto-refresh" type="checkbox" checked><span class="switch" aria-hidden="true"></span></label><button id="refresh" class="button outline" type="button"><span aria-hidden="true">↻</span> 刷新</button></div>
    </section>
    <div id="notice" class="notice" role="status" hidden></div>
    <section class="health" aria-label="运行环境状态">
      <div class="health-item"><span id="dsh-dot" class="dot"></span><span>DSH 运行时</span><strong id="dsh-runtime">等待连接</strong></div>
      <div class="health-item"><span id="env-dot" class="dot"></span><span>启动环境</span><strong id="env-state">等待连接</strong></div>
      <div class="health-item"><span id="records-dot" class="dot"></span><span>交互记录</span><strong id="record-count">等待连接</strong></div>
      <time id="updated">—</time>
    </section>
    <section id="env-warning" class="env-warning" hidden></section>
    <div class="monitor-layout">
      <aside class="request-list" aria-label="最近的 DSH 任务">
        <div class="list-head"><h2>最近的 DSH 任务</h2><label class="sr-only" for="status-filter">筛选状态</label><select id="status-filter"><option value="all">全部状态</option><option value="pending">待确认</option><option value="running">运行中</option><option value="succeeded">已完成</option><option value="failed">执行失败</option><option value="rejected">已取消</option></select></div>
        <div id="requests" class="requests"><div class="empty small">连接观察台后显示真实 DSH 请求。</div></div>
      </aside>
      <section id="detail" class="detail" aria-live="polite"><div class="empty"><span class="empty-mark" aria-hidden="true">↔</span><h2>等待交互记录</h2><p>连接后可以查看每次请求是否获批、是否启动 DSH、它返回了什么，以及结果消息是否送达 QQ。</p><button id="connect-empty" class="button primary" type="button">连接观察台</button></div></section>
    </div>
    <footer><span>仅显示经脱敏的任务输入、进程输出与投递回执；不会展示 API 密钥。</span><span>自动刷新间隔 15 秒</span></footer>
  </main>
  <dialog id="auth-dialog" aria-labelledby="auth-title">
    <form id="auth-form"><div class="dialog-head"><div><h2 id="auth-title">连接交互记录</h2><p>使用记忆观察台或知识花园的只读访问密钥。</p></div><button id="close-dialog" class="close" type="button" aria-label="关闭">×</button></div><label for="token">访问密钥</label><input id="token" type="password" autocomplete="off" required placeholder="粘贴观察密钥"><small>密钥只保存在当前浏览器会话中。</small><p id="auth-error" class="error" role="alert"></p><div class="dialog-actions"><button id="disconnect" class="button light" type="button">断开</button><button class="button primary" type="submit">连接</button></div></form>
  </dialog>
</body>
</html>
