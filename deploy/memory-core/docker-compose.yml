services:
  memory-core:
    # Build this exact upstream commit; do not replace with latest in production.
    image: tencentdb-agent-memory:5299c00aaf65481703c180fd69df066d11254eb7
    ports:
      - "8420:8420"
    environment:
      NODE_ENV: production
      TDAI_GATEWAY_CONFIG: /data/config/tdai-gateway.yaml
      TDAI_GATEWAY_HOST: 0.0.0.0
      TDAI_DATA_DIR: /data/tdai-memory
      TDAI_LLM_API_KEY: ${TDAI_LLM_API_KEY:?set TDAI_LLM_API_KEY}
      TDAI_LLM_BASE_URL: ${TDAI_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      TDAI_LLM_MODEL: ${TDAI_LLM_MODEL:-qwen-plus}
      TDAI_GATEWAY_API_KEY: ${TDAI_GATEWAY_API_KEY:-}
    volumes:
      - memory-core-data:/data/tdai-memory
      - ./tdai-gateway.standalone.yaml:/data/config/tdai-gateway.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  memory-core-data:

