# Install in the Nginx http context. Adjust certificate paths and server_name.
# These two servers must run on the host with the loopback-only Python service.
server {
    listen 443 ssl;
    server_name 36.212.7.43;
    ssl_certificate /etc/door-audio/tls/fullchain.pem;
    ssl_certificate_key /etc/door-audio/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 17m;

    location / {
        proxy_pass http://127.0.0.1:18022;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /api/device/door-audio {
        include /etc/nginx/door-audio-device.inc;
    }
}

# Compatibility endpoint for firmware already flashed with the HTTP URL.
server {
    listen 8022;
    server_name 36.212.7.43;
    location = /api/device/door-audio {
        include /etc/nginx/door-audio-device.inc;
    }

    location / {
        return 404;
    }
}
